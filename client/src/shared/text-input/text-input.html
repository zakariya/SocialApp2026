<label class="floating-label  flex flex-col text-left">
    <span>{{label() }} </span>
    <input [name]="label()" class="input w-full" [type]="type()"
    [max] = "maxDate()"
        [class.input-error]="control.invalid && control.touched"
        [class.input-success]="control.valid && control.touched" [formControl]="control" [placeholder]="label()" />
    @if(control.hasError('required') && control.touched){
    <div class=" text-error text-xs">{{label() }} is required</div>
    }
    @if(control.hasError('email') && control.touched){
    <div class="mt-2 text-error text-xs">Invalid email address</div>
    }
    @if(control.hasError('minlength') && control.touched){
    <div class="mt-2 text-error text-xs">{{label() }} must be at least
        {{control.errors?.['minlength'].requiredLength}} characters long </div>
    }
    @if(control.hasError('maxlength') && control.touched){
    <div class="mt-2 text-error text-xs">{{label() }} must be at most
        {{control.errors?.['maxlength'].requiredLength}} characters long </div>
    }
    @if(control.hasError('passwordMismatch') && control.touched){
    <div class="mt-2 text-error text-xs ">Password do not matched</div>
    }
</label>
